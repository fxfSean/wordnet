[project]
name = "vocab-pipeline"
version = "0.1.0"
description = "Learner dictionary production pipeline"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15",
    "pydantic>=2,<3",
    "pyyaml>=6",
    "python-dotenv>=1",
    "httpx>=0.28.1",
    "tenacity>=9.2.1",
]

[project.scripts]
vocab = "vocab_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.ruff]
target-version = "py311"
